[package]
name = "mg-taskr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Process and system manager for the Geist suite: CLI, TUI and JSON for the shell"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
